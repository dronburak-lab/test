orchestrator:
  poll_interval_seconds: 15
  max_active_tasks: 1
  lock_file: ".agent-orchestrator.lock"
  dry_run: false

task_store:
  backend: "google_sheets" # google_sheets|excel — для Sheets: pip install google-api-python-client google-auth
  google_sheets:
    spreadsheet_id: "1v3Z9Hv2NDrQKzS4ITfZApUi0Ja1Uznk1WQ06Tp5ng_0"
    worksheet_name: "tasks"
    worksheet_gid: 1970676925
    credentials_json_env: "GOOGLE_SERVICE_ACCOUNT_JSON"

# target_branch — база для rebase; remote — куда push (имя из git remote -v).
# push_ref_template: на GitHub не используйте refs/for/... (это не Gerrit) — иначе non-fast-forward на один и тот же ref.
# Плейсхолдеры: {target_branch}, {slug}, {task_id}
gerrit:
  target_branch: main
  remote: origin
  push_ref_template: "refs/heads/agent/{slug}-{task_id}"
  push_force_with_lease: false

agent_runner:
  backend: "cursor" # cursor|other
  cursor_agent:
    # Оболочка перед промптом (в кавычках после shlex): выполняется description задачи в рабочей копии.
    command_prefix: "cursor agent -p --force"
    agent_output_max_chars: 8000

tools_provider:
  backend: "local" # local|mcp
  mcp:
    server: "http://localhost:3000"
    timeout_seconds: 30

policy:
  allow_network: false
  allowed_paths:
    - "."
  blocked_paths:
    - "/"
    - "/etc"
    - "/usr"
  allowed_commands:
    - "git status"
    - "git add"
    - "git commit"
    - "git push"
    - "git switch"
    - "git worktree"
    - "python -m pytest"
  allowed_command_prefixes:
    - "git "
    - "python "
    - "cursor "
  blocked_commands:
    - "rm -rf"
    - "git reset --hard"
    - "sudo "
